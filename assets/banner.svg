<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#080c14" />
    </linearGradient>

    <!-- Header Gradient for Title -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Border Linear Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.2" />
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>

    <style>
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 40px;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
        font-weight: 400;
        font-size: 16px;
        letter-spacing: 0.1px;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 12px;
        letter-spacing: 0.8px;
        text-transform: uppercase;
      }

      /* GitHub Camo Safe CSS Keyframe Animations */
      @keyframes floatBeam {
        0% { stroke-dashoffset: 400; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes orbitFlow {
        0% { stroke-dashoffset: 600; }
        100% { stroke-dashoffset: -600; }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 0.65; }
      }

      .beam-stream-1 {
        stroke-dasharray: 80, 240;
        animation: floatBeam 6s linear infinite;
      }
      .beam-stream-2 {
        stroke-dasharray: 100, 280;
        animation: floatBeam 8s linear infinite reverse;
      }
      .orbit-ring {
        stroke-dasharray: 160, 200;
        animation: orbitFlow 12s linear infinite;
      }
      .ambient-glow {
        animation: pulseGlow 5s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- 1. Background Canvas -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- 2. Outer Subtle Glowing Border -->
  <rect width="1198" height="358" x="1" y="1" rx="15" fill="none" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- 3. Ambient Background Lighting -->
  <circle class="ambient-glow" cx="180" cy="110" r="180" fill="url(#glowCyan)" />
  <circle class="ambient-glow" cx="1020" cy="250" r="200" fill="url(#glowPurple)" />

  <!-- 4. Background Event Mesh Grid Lines -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="120" y1="0" x2="120" y2="360" />
    <line x1="280" y1="0" x2="280" y2="360" />
    <line x1="440" y1="0" x2="440" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="760" y1="0" x2="760" y2="360" />
    <line x1="920" y1="0" x2="920" y2="360" />
    <line x1="1080" y1="0" x2="1080" y2="360" />
    <line x1="0" y1="90" x2="1200" y2="90" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="270" x2="1200" y2="270" />
  </g>

  <!-- 5. Dynamic Webhook Event Streams (Safely in background) -->
  <g fill="none">
    <!-- Stream Line 1 -->
    <path d="M 50,290 C 280,310 380,240 600,260 C 820,280 940,330 1150,290" stroke="#38bdf8" stroke-width="2" opacity="0.25" />
    <path class="beam-stream-1" d="M 50,290 C 280,310 380,240 600,260 C 820,280 940,330 1150,290" stroke="#38bdf8" stroke-width="3.5" />

    <!-- Stream Line 2 -->
    <path d="M 50,80 C 250,50 420,110 650,80 C 880,50 1020,110 1150,75" stroke="#c084fc" stroke-width="2" opacity="0.25" />
    <path class="beam-stream-2" d="M 50,80 C 250,50 420,110 650,80 C 880,50 1020,110 1150,75" stroke="#c084fc" stroke-width="3.5" />

    <!-- Dynamic Flow Circuit Orbits -->
    <ellipse class="orbit-ring" cx="1070" cy="90" rx="90" ry="40" stroke="#818cf8" stroke-width="1.8" opacity="0.45" />
    <ellipse class="orbit-ring" cx="130" cy="270" rx="85" ry="38" stroke="#38bdf8" stroke-width="1.8" opacity="0.45" />
  </g>

  <!-- 6. Pulsing Webhook Nodes (SMIL-animated for universal support) -->
  <g>
    <circle cx="1070" cy="90" r="5" fill="#c084fc">
      <animate attributeName="r" values="4;7;4" dur="2.8s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2.8s" repeatCount="indefinite" />
    </circle>
    <circle cx="130" cy="270" r="5" fill="#38bdf8">
      <animate attributeName="r" values="4;7;4" dur="2.4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2.4s" repeatCount="indefinite" />
    </circle>
    <circle cx="940" cy="305" r="4" fill="#38bdf8">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite" />
    </circle>
    <circle cx="260" cy="62" r="4" fill="#c084fc">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.2s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- 7. FOREGROUND CONTENT: Header Category Pill -->
  <g transform="translate(600, 75)">
    <rect x="-180" y="-18" width="360" height="34" rx="17" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity="0.95" />
    <!-- Blinking Indicator Dot -->
    <circle cx="-155" cy="-1" r="5" fill="#34d399">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.8s" repeatCount="indefinite" />
    </circle>
    <text class="badge-text" x="-140" y="3" fill="#38bdf8">⚡ CURATED EVENT-DRIVEN DIRECTORY</text>
  </g>

  <!-- 8. FOREGROUND CONTENT: Main Title -->
  <g transform="translate(600, 160)">
    <text class="title-text" text-anchor="middle" fill="#ffffff">
      Awesome Webhook Event Triggers
    </text>
    <text class="title-text" text-anchor="middle" y="44" fill="url(#primaryGrad)">
      &amp; Subscriptions Ecosystem
    </text>
  </g>

  <!-- 9. FOREGROUND CONTENT: Subtitle -->
  <g transform="translate(600, 255)">
    <text class="subtitle-text" text-anchor="middle" fill="#94a3b8">
      A directory of Webhooks-as-a-Service (WaaS), Event Gateways, Ingestion Proxies &amp; Delivery Infrastructure
    </text>
  </g>

  <!-- 10. FOREGROUND CONTENT: Metric & Capability Badges -->
  <g transform="translate(600, 312)">
    <!-- Chip 1: Hosted & SaaS -->
    <g transform="translate(-240, 0)">
      <rect x="-70" y="-14" width="140" height="26" rx="13" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text class="badge-text" x="0" y="3" text-anchor="middle" fill="#e2e8f0">☁️ Hosted SaaS</text>
    </g>

    <!-- Chip 2: Open Source -->
    <g transform="translate(-80, 0)">
      <rect x="-70" y="-14" width="140" height="26" rx="13" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text class="badge-text" x="0" y="3" text-anchor="middle" fill="#e2e8f0">🔓 Open Source</text>
    </g>

    <!-- Chip 3: Event Delivery -->
    <g transform="translate(80, 0)">
      <rect x="-70" y="-14" width="140" height="26" rx="13" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text class="badge-text" x="0" y="3" text-anchor="middle" fill="#e2e8f0">🚀 Reliable Fanout</text>
    </g>

    <!-- Chip 4: HMAC & Security -->
    <g transform="translate(240, 0)">
      <rect x="-70" y="-14" width="140" height="26" rx="13" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text class="badge-text" x="0" y="3" text-anchor="middle" fill="#e2e8f0">🛡️ HMAC Signing</text>
    </g>
  </g>
</svg>
