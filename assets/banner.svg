<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#080c14" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="pulseCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="pulsePurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#60a5fa" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .title-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 42px;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        font-size: 17px;
        letter-spacing: 0.2px;
      }
      .badge-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 12px;
        letter-spacing: 0.8px;
        text-transform: uppercase;
      }

      /* Dynamic Wave & Stream Animations */
      @keyframes floatBeam {
        0% { stroke-dashoffset: 400; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes pulseNode {
        0%, 100% { transform: scale(1); opacity: 0.7; }
        50% { transform: scale(1.15); opacity: 1; filter: drop-shadow(0 0 12px #38bdf8); }
      }
      @keyframes orbitFlow {
        0% { stroke-dashoffset: 800; }
        100% { stroke-dashoffset: -800; }
      }
      @keyframes ambientGlow {
        0%, 100% { opacity: 0.25; transform: scale(1); }
        50% { opacity: 0.45; transform: scale(1.08); }
      }

      .beam-1 {
        stroke-dasharray: 80, 260;
        animation: floatBeam 6s linear infinite;
      }
      .beam-2 {
        stroke-dasharray: 100, 300;
        animation: floatBeam 8s linear infinite reverse;
      }
      .beam-orbit {
        stroke-dasharray: 200, 200;
        animation: orbitFlow 14s linear infinite;
      }
      .pulse-item {
        transform-origin: center;
        animation: pulseNode 3.5s ease-in-out infinite;
      }
      .ambient-blob {
        transform-origin: center;
        animation: ambientGlow 7s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Outer Modern Subtle Border -->
  <rect width="1198" height="358" x="1" y="1" rx="15" fill="none" stroke="url(#lineGrad)" stroke-width="1.5" />

  <!-- Background Ambient Glowing Orbs -->
  <circle class="ambient-blob" cx="180" cy="100" r="140" fill="url(#pulseCyan)" filter="url(#softGlow)" />
  <circle class="ambient-blob" cx="1020" cy="240" r="160" fill="url(#pulsePurple)" filter="url(#softGlow)" />

  <!-- Background Event Mesh Grid -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="360" />
    <line x1="250" y1="0" x2="250" y2="360" />
    <line x1="400" y1="0" x2="400" y2="360" />
    <line x1="550" y1="0" x2="550" y2="360" />
    <line x1="700" y1="0" x2="700" y2="360" />
    <line x1="850" y1="0" x2="850" y2="360" />
    <line x1="1000" y1="0" x2="1000" y2="360" />
    <line x1="0" y1="90" x2="1200" y2="90" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="270" x2="1200" y2="270" />
  </g>

  <!-- Dynamic Animated Webhook Event Streams (Safely in background) -->
  <g fill="none">
    <!-- Stream Line 1 -->
    <path d="M 50,300 C 300,320 380,240 600,260 C 820,280 950,340 1150,300" stroke="#38bdf8" stroke-width="2" opacity="0.25" />
    <path class="beam-1" d="M 50,300 C 300,320 380,240 600,260 C 820,280 950,340 1150,300" stroke="#38bdf8" stroke-width="3" filter="url(#glow)" />

    <!-- Stream Line 2 -->
    <path d="M 50,70 C 250,40 400,110 650,80 C 900,50 1020,120 1150,80" stroke="#c084fc" stroke-width="2" opacity="0.25" />
    <path class="beam-2" d="M 50,70 C 250,40 400,110 650,80 C 900,50 1020,120 1150,80" stroke="#c084fc" stroke-width="3" filter="url(#glow)" />

    <!-- Dynamic Flow Circuit Circle in Corner -->
    <ellipse class="beam-orbit" cx="1060" cy="90" rx="90" ry="40" stroke="#818cf8" stroke-width="1.5" opacity="0.4" />
    <ellipse class="beam-orbit" cx="130" cy="270" rx="80" ry="35" stroke="#38bdf8" stroke-width="1.5" opacity="0.4" />
  </g>

  <!-- Pulsing Nodes (Signaling Ingestion, Delivery, Routing) -->
  <g class="pulse-item">
    <circle cx="1060" cy="90" r="5" fill="#a855f7" filter="url(#glow)" />
    <circle cx="130" cy="270" r="5" fill="#38bdf8" filter="url(#glow)" />
    <circle cx="950" cy="305" r="4" fill="#38bdf8" filter="url(#glow)" />
    <circle cx="250" cy="62" r="4" fill="#c084fc" filter="url(#glow)" />
  </g>

  <!-- FOREGROUND CONTENT: Header Badges & Pill (Always crystal clear & on top) -->
  <g transform="translate(600, 75)">
    <!-- Pill Container -->
    <rect x="-180" y="-18" width="360" height="34" rx="17" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity="0.9" />
    <!-- Indicator Dot -->
    <circle cx="-155" cy="-1" r="5" fill="#34d399">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <!-- Pill Text -->
    <text class="badge-text" x="-140" y="3" fill="#38bdf8">⚡ CURATED EVENT-DRIVEN DIRECTORY</text>
  </g>

  <!-- FOREGROUND CONTENT: Main Title -->
  <g transform="translate(600, 160)">
    <text class="title-text" text-anchor="middle" fill="#ffffff" filter="url(#glow)">
      Awesome Webhook Event Triggers
    </text>
    <text class="title-text" text-anchor="middle" y="44" fill="url(#primaryGrad)">
      &amp; Subscriptions Ecosystem
    </text>
  </g>

  <!-- FOREGROUND CONTENT: Subtitle & Description -->
  <g transform="translate(600, 255)">
    <text class="subtitle-text" text-anchor="middle" fill="#94a3b8">
      A directory of Webhooks-as-a-Service (WaaS), Event Gateways, Ingestion Proxies &amp; Delivery Infrastructure
    </text>
  </g>

  <!-- Feature Metric Chips (At bottom for high-tech aesthetic) -->
  <g transform="translate(600, 310)">
    <!-- Chip 1: Hosted & SaaS -->
    <g transform="translate(-240, 0)">
      <rect x="-70" y="-14" width="140" height="26" rx="13" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text class="badge-text" x="0" y="3" text-anchor="middle" fill="#e2e8f0">☁️ Hosted SaaS</text>
    </g>

    <!-- Chip 2: Open Source -->
    <g transform="translate(-80, 0)">
      <rect x="-70" y="-14" width="140" height="26" rx="13" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text class="badge-text" x="0" y="3" text-anchor="middle" fill="#e2e8f0">🔓 Open Source</text>
    </g>

    <!-- Chip 3: Event Delivery -->
    <g transform="translate(80, 0)">
      <rect x="-70" y="-14" width="140" height="26" rx="13" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text class="badge-text" x="0" y="3" text-anchor="middle" fill="#e2e8f0">🚀 Reliable Fanout</text>
    </g>

    <!-- Chip 4: HMAC & Security -->
    <g transform="translate(240, 0)">
      <rect x="-70" y="-14" width="140" height="26" rx="13" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text class="badge-text" x="0" y="3" text-anchor="middle" fill="#e2e8f0">🛡️ HMAC Signing</text>
    </g>
  </g>
</svg>
